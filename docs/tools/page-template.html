<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="author" content="{{AUTHORS}}">
<meta name="color-scheme" content="light">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffffff'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%2316181a' font-family='Georgia,serif'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/paper.css">
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <a class="running-title" href="#top">{{SHORTTITLE}}</a>
    <nav>
      <a href="#abstract">摘要</a>
      <a href="#appendix">附录</a>
      <a href="#references">参考文献</a>
      <button id="btnToc" class="text-btn only-mobile" type="button">目录</button>
      <button id="btnPrint" class="text-btn" type="button">打印</button>
    </nav>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <input id="tocFilter" type="search" placeholder="过滤目录" autocomplete="off">
    </div>
    <nav class="toc" id="toc"><ul>{{TOC}}</ul></nav>
    <div class="side-foot">
      <button id="btnTop" class="text-btn" type="button">回到顶部</button>
    </div>
  </aside>

  <main id="top" class="paper">
    <article>
      <header class="title-block">
        <h1>{{TITLE}}</h1>
        <p class="subtitle">{{SUBTITLE}}</p>
        <p class="byline">{{AUTHORS}}<span class="sep">·</span>{{DATE}}<span class="sep">·</span>{{DOCTYPE}}</p>
        <p class="source-line">{{SOURCE}}</p>
      </header>

      <section class="abstract" id="abstract">
        <h2 class="abstract-title">摘要</h2>
        {{ABSTRACT}}
      </section>

      <div class="body">
{{BODY}}
      </div>

      <footer class="paper-footer">
        <p>{{STATS}}</p>
        <p class="tiny">本文档为纯静态页面，可用浏览器直接打印或导出为 A4 版式 PDF。构建时间 {{GENERATED}}。</p>
      </footer>
    </article>
  </main>
</div>

<script src="assets/paper.js"></script>
</body>
</html>
